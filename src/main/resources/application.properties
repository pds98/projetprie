spring.application.name=Gest_priere_springboot

server.port=${PORT:8080}
spring.datasource.url=jdbc:mariadb://76.13.121.48:3306/GestionPriere?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=ousmane
spring.datasource.password=ousmane
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Jackson : evite l'erreur "Cannot map null into type boolean/int"
# quand le frontend envoie null pour un champ primitif
spring.jackson.deserialization.fail-on-null-for-primitives=false

# CORS - autorise l'app mobile depuis n'importe ou
spring.web.cors.allowed-origins=*
